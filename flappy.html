<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Неон-птица</title><style>html,body{overflow:hidden;height:100%}#gc{position:fixed;inset:0;width:100%;height:100%}</style></head><body>
<script src="common.js"></script><script>
gbg(1);const cv=document.createElement('canvas');cv.id='gc';document.body.appendChild(cv);const g=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const GAP=175;let by=300,bv=0,pipes=[],sc=0,st=0,best=+localStorage.getItem('flp1')||0,sp=220,tmr=0,pt=[],lt=0;
function reset(){by=H/2;bv=0;pipes=[];sc=0;sp=220;tmr=1.2;st=1;pt=[]}
function flap(){if(st!=1)reset();bv=-470;bleep(700,.06,'triangle',.06,200);for(let i=0;i<6;i++)pt.push({x:W*.25,y:by,vx:rnd(-90,-20),vy:rnd(-40,60),l:.5})}
function crash(){st=2;if(sc>best){best=sc;try{localStorage.setItem('flp1',best)}catch(e){}}bleep(150,.5,'sawtooth',.1,-100)}
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='ArrowUp'){e.preventDefault();if(!e.repeat)flap()}});addEventListener('mousedown',flap);addEventListener('touchstart',flap);
function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;const [c1,c2,c3]=THEMES[U.th|0].c,bx=W*.25;
if(st==1){bv+=1500*dt;by+=bv*dt;tmr-=dt;sp=220+sc*4;if(tmr<=0){tmr=1.5;pipes.push({x:W+40,gy:rnd(110,Math.max(120,H-110-GAP)),s:0})}
 for(const p of pipes){p.x-=sp*dt;if(!p.s&&p.x+70<bx){p.s=1;sc++;bleep(880,.08,'triangle',.07)}if(bx+14>p.x&&bx-14<p.x+70&&(by-14<p.gy||by+14>p.gy+GAP))crash()}
 pipes=pipes.filter(p=>p.x>-90);if(by>H-14||by<0)crash()}
for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}pt=pt.filter(p=>p.l>0);
g.clearRect(0,0,W,H);
for(const p of pipes){g.shadowColor=c1;g.shadowBlur=16;g.fillStyle=al(c1,.35);g.strokeStyle=c1;g.lineWidth=3;g.fillRect(p.x,-5,70,p.gy+5);g.strokeRect(p.x,-5,70,p.gy+5);g.fillRect(p.x,p.gy+GAP,70,H);g.strokeRect(p.x,p.gy+GAP,70,H)}g.shadowBlur=0;
for(const p of pt){g.globalAlpha=Math.max(0,p.l/.5);g.fillStyle=c3;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;
const tilt=Math.max(-.5,Math.min(1,bv/800));g.save();g.translate(bx,by);g.rotate(tilt);g.shadowColor=c3;g.shadowBlur=18;g.fillStyle=c3;g.beginPath();g.arc(0,0,14,0,6.283);g.fill();g.fillStyle=c2;g.beginPath();g.ellipse(-4,3+Math.sin(ts/60)*3,9,5,-.4,0,6.283);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(6,-4,4,0,6.283);g.fill();g.fillStyle='#111';g.beginPath();g.arc(7,-4,2,0,6.283);g.fill();g.restore();g.shadowBlur=0;
g.textAlign='center';g.fillStyle='#fff';g.font='800 56px "Segoe UI",sans-serif';if(st==1)g.fillText(sc,W/2,90);
if(st!=1){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);g.fillStyle=c3;g.shadowColor=c3;g.shadowBlur=18;g.font='800 44px "Segoe UI",sans-serif';g.fillText(st==0?'НЕОН-ПТИЦА':'КОНЕЦ · '+sc,W/2,H/2-10);g.shadowBlur=0;g.font='18px "Segoe UI",sans-serif';g.fillStyle='#fff';g.fillText('Пробел / клик — взмах · Рекорд: '+best,W/2,H/2+30)}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
