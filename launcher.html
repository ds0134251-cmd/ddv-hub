<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDV Game Hub</title>
<style>
:root{--c1:#00f0ff;--c2:#ff2bd6;--c3:#ffe14a;--bg:#07040f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;transition:opacity .35s}
body.out{opacity:0}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto}
header{display:flex;align-items:center;gap:18px;padding:18px 28px;flex-wrap:wrap}
.logo{font-weight:800;font-size:26px;letter-spacing:.14em;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px var(--c2))}
.tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
button{font:inherit;color:#fff;cursor:pointer;border:1px solid var(--c1);background:rgba(10,4,30,.55);border-radius:12px;padding:9px 18px;transition:.15s;backdrop-filter:blur(6px)}
button:hover{box-shadow:0 0 18px var(--c1);transform:translateY(-2px)}
button.sel{background:var(--c1);color:#000;font-weight:700}
.by{padding:6px 18px;border:1px solid var(--c3);border-radius:99px;color:var(--c3);font-size:13px;letter-spacing:.1em;box-shadow:0 0 16px var(--c3)}.by b{color:#fff}
main{flex:1;padding:0 28px 26px;max-width:1240px;width:100%;margin:0 auto}
.hi{font-size:18px;opacity:.9;margin:6px 0 18px;text-shadow:0 1px 8px #000}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.gc{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:22px;background:rgba(10,6,28,.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);transition:.25s}
.gc:hover{transform:translateY(-8px);border-color:var(--c1);box-shadow:0 14px 50px rgba(0,0,0,.5),0 0 30px var(--c1)}
.ban{height:140px;border-radius:14px;display:grid;place-items:center;font-size:70px;overflow:hidden;position:relative}
.ban span{animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 16px #fff)}
@keyframes fl{50%{transform:translateY(-10px) rotate(4deg)}}
.b1{background:linear-gradient(135deg,var(--c1),var(--c2))}.b2{background:linear-gradient(135deg,var(--c3),var(--c2))}.b3{background:linear-gradient(135deg,#1b2a6b,var(--c1))}
.gc h2{font-size:24px}.tags{font-size:12px;color:var(--c3);letter-spacing:.06em}
.gc p{font-size:14px;line-height:1.55;opacity:.88;flex:1}.st{font-size:12px;opacity:.7}
.play{font-size:18px;font-weight:800;letter-spacing:.12em;padding:13px;border-color:var(--c2);background:var(--c2);color:#000}
.rx{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.lc{padding:12px;border-radius:16px;background:rgba(10,6,28,.62);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:6px;transition:.2s}
.lc.on{border-color:var(--c1);box-shadow:0 0 20px var(--c1)}.lc .ic{font-size:30px}.lc input{width:100%;accent-color:var(--c2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{padding:6px 14px;border-radius:99px;font-size:13px}
.sec{margin:6px 0 12px;font-size:26px;text-shadow:0 1px 8px #000}.sec small{font-size:14px;opacity:.75;font-weight:400}.b4{background:linear-gradient(135deg,#00c853,var(--c1))}.b5{background:linear-gradient(135deg,#f59e0b,var(--c2))}.b6{background:linear-gradient(135deg,#475569,var(--c1))}
h3{margin:14px 0 4px;font-size:15px;color:var(--c3);letter-spacing:.06em}
.glass{padding:16px;border-radius:18px;background:rgba(10,6,28,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);margin-bottom:12px}
.sw{width:120px;height:70px;color:#000;font-weight:800;text-shadow:0 0 6px #fff8;border-color:transparent}.sw.sel{outline:3px solid #fff}
.mv{display:flex;align-items:center;gap:12px}.mv input{accent-color:var(--c2);width:220px}
footer{text-align:center;padding:12px;font-size:12px;opacity:.55}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
<header><div class="logo">DDV GAME HUB</div>
<div class="tabs"><button id="t0" class="sel" onclick="view(0)">🎮 Игры</button><button id="t1" onclick="view(1)">🌊 Тихая гавань</button><button id="t2" onclick="view(2)">🎨 Оформление</button></div>
<div class="by">создатель · <b>ddv_7202</b></div></header>
<main>

<section id="v1" style="display:none"><h2 class="sec">Тихая гавань <small>— звуки и музыка для полного расслабления</small></h2>
<div class="glass"><h3>Готовые пресеты</h3><div class="row" id="pre"></div><div class="st" id="now" style="margin-top:6px"></div></div>

<h3>Таймер сна</h3><div class="row" id="slp"></div></div>
<div class="rx" id="lay"></div></section>
<section id="v2" style="display:none"><div class="glass"><h3>Цветовая тема (действует во всех играх)</h3><div class="row" id="thm"></div></div>
<div class="glass"><h3>Анимированный фон (лаунчер, казино, мини-игры, гавань)</h3><div class="row" id="scn"></div></div>
<div class="glass"><h3>Анимации</h3><div class="row" id="anm"></div></div></section>
</main>
<footer>DDV Game Hub · сделал ddv_7202</footer></div>
<script src="common.js"></script>

{u:'upgrader.html',ic:'🔫',t:'Апгрейдер',cat:'casino',tg:'ПРЕДМЕТЫ ПО МОТИВАМ RUST · ШАНС · УДАЧА',d:'Сложи несколько дешёвых предметов — например, пару «Томпсонов» — и попробуй превратить их в «Калаш». Чем дороже цель, тем ниже шанс: колесо покажет его заранее. Есть магазин, продажа и три вида ящиков. Предметы и монеты виртуальные, настоящих денег нет.',st:()=>LV('upg1',v=>`Апгрейдов: ✔ ${v.w|0} · ✖ ${v.l|0}`,'Общий баланс монет с казино')},

{u:'flappy.html',ic:'🐤',t:'Неон-птица',cat:'arcade',tg:'АРКАДА · РЕФЛЕКСЫ',d:'Лети между неоновыми трубами, не касаясь их. Один клик — один взмах. Скорость растёт с каждым очком, а за птицей тянется светящийся след.',st:()=>LV('flp1',v=>'Рекорд: '+v)},
{u:'breakout.html',ic:'🏓',t:'Неон-арканоид',cat:'arcade',tg:'АРКАДА · БОНУСЫ',d:'Отбивай шарик платформой и разбивай кирпичи. Бонусы: удлинение платформы, мультишар, лишняя жизнь и замедление. Уровни становятся сложнее.',st:()=>LV('brk1',v=>'Рекорд: '+v)},

{u:'aim.html',ic:'🎯',t:'Аим-тренер',cat:'action',tg:'РЕАКЦИЯ · ТОЧНОСТЬ',d:'Тридцать секунд на то, чтобы попасть по как можно большему числу сужающихся мишеней. В конце считаются точность и средняя реакция в миллисекундах.',st:()=>LV('aim1',v=>'Рекорд: '+v+' попаданий')},
{u:'g2048.html',ic:'🔢',t:'2048',cat:'puzzle',tg:'ГОЛОВОЛОМКА · ЛОГИКА',d:'Сдвигай плитки и соединяй одинаковые числа, чтобы собрать заветные 2048. Управление стрелками или свайпом, отмена хода и сохраняемый рекорд.',st:()=>LV('g20481',v=>'Рекорд: '+v)},
{u:'mines.html',ic:'💣',t:'Сапёр',cat:'puzzle',tg:'ГОЛОВОЛОМКА · ТРИ УРОВНЯ',d:'Найди все мины и не взорвись. Три уровня сложности, флажки, безопасный первый ход и таблица лучших времён.',st:()=>LV('mn1',v=>'Лучшее время: '+[0,1,2].map(i=>v[i]?v[i]+' с':'—').join(' / '))},
{u:'ttt.html',ic:'❌',t:'Крестики-нолики',cat:'puzzle',tg:'СТРАТЕГИЯ · ПРОТИВ БОТА',d:'Сыграй против бота — от лёгкого до «Невозможного»: он просчитывает все ходы и не проигрывает. Ведётся общий счёт побед, ничьих и поражений.',st:()=>LV('ttt1',v=>`Побед: ${v.w} · Ничьих: ${v.d} · Поражений: ${v.l}`)},
{u:'memory.html',ic:'🧠',t:'Память',cat:'puzzle',tg:'ПАМЯТЬ · ТРИ РАЗМЕРА ПОЛЯ',d:'Находи пары карточек за минимум ходов. Три размера поля, время и личный рекорд для каждого.',st:()=>LV('mem1',v=>'Лучшее: '+[0,1,2].map(i=>v[i]?v[i]:'—').join(' / ')+' ходов')},
{u:'words.html',ic:'🔤',t:'Слово',cat:'puzzle',tg:'СЛОВА · КАК WORDLE',d:'Угадай слово из пяти букв за шесть попыток — как в Wordle, но на русском. «Слово дня» и случайные слова, серии побед и подсветка клавиатуры.',st:()=>LV('wd1',v=>`Серия: ${v.s} · Лучшая серия: ${v.b} · Побед: ${v.w}`)},

{u:'clicker.html',ic:'🪐',t:'Космо-ферма',cat:'fun',tg:'КЛИКЕР · ПРОГРЕСС ПОКА ТЕБЯ НЕТ',d:'Жми на планету, покупай генераторы — от солнечных панелей до целых галактик — и лови кометы. Энергия копится даже когда ты закрыл игру (до 8 часов).',st:()=>LV('clk1',v=>'Всего энергии: '+K(v.tot||0))},

{u:'draw.html',ic:'🎨',t:'Неон-рисовалка',cat:'fun',tg:'ТВОРЧЕСТВО · СИММЕТРИЯ',d:'Рисуй светящимися линиями с зеркальной симметрией (до 12 лучей), меняй толщину кисти и включай затухание следа. Очень медитативно.',st:()=>'Рисуй мышью или пальцем'}];
let FC='all';
function cards(){$('cards').innerHTML=GAMES.filter(g=>FC=='all'||g.cat==FC).map((g,i)=>`<article class="gc"><div class="ban b${i%6+1}"><span>${g.ic}</span></div><h2>${g.t}</h2><div class="tags">${g.tg}</div><p>${g.d}</p><div class="st">${g.st?g.st():''}</div><button class="play" onclick="${g.u=='#relax'?'view(1)':`launch('${g.u}')`}">▶ ${g.u=='#relax'?'ОТКРЫТЬ':'ИГРАТЬ'}</button></article>`).join('')}
function filt(f){FC=f;$('flt').innerHTML=[['all','Все'],['action','Экшен'],['arcade','Аркады'],['puzzle','Головоломки'],['casino','Казино'],['relax','Спокойное'],['fun','Креатив']].map(([k,t])=>`<button class="chip${f==k?' sel':''}" onclick="filt('${k}')">${t} (${k=='all'?GAMES.length:GAMES.filter(g=>g.cat==k).length})</button>`).join('');cards()}
$('hi').textContent=(h<6?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер')+'! Выбирай игру ('+GAMES.length+' штук) или иди расслабляться.';

rBuild();
