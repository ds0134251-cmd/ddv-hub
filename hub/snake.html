<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Неон-змейка</title>
<style>html,body{overflow:hidden;height:100%}#gc{position:fixed;inset:0;width:100%;height:100%}</style>
</head><body>
<script src="common.js"></script>
<script>
gbg(1);
const cv=document.createElement('canvas');cv.id='gc';document.body.appendChild(cv);const g=cv.getContext('2d');
const COLS=26,ROWS=16;let W,H,cs,ox,oy;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cs=Math.max(8,Math.floor(Math.min((W-40)/COLS,(H-130)/ROWS)));ox=(W-cs*COLS)/2;oy=(H-cs*ROWS)/2+24}
addEventListener('resize',rs);rs();
let sn=[[8,8],[7,8],[6,8]],dir=[1,0],nd=[1,0],food=[15,8],gold=null,sc=0,best=+localStorage.getItem('snk1')||0,spd=8,acc=0,st=0,pt=[],lt=0; // st: 0 старт, 1 игра, 2 конец, 3 пауза
function rf(){let p;do{p=[Math.random()*COLS|0,Math.random()*ROWS|0]}while(sn.some(s=>s[0]==p[0]&&s[1]==p[1]));return p}
function reset(){sn=[[8,8],[7,8],[6,8]];dir=[1,0];nd=[1,0];sc=0;spd=8;acc=0;food=rf();gold=null;pt=[];st=1}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=40+Math.random()*180;pt.push({x:ox+(x+.5)*cs,y:oy+(y+.5)*cs,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function step(){dir=nd;const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
if(h[0]<0||h[1]<0||h[0]>=COLS||h[1]>=ROWS||sn.some(s=>s[0]==h[0]&&s[1]==h[1])){st=2;if(sc>best){best=sc;try{localStorage.setItem('snk1',best)}catch(e){}}burst(sn[0][0],sn[0][1],50,'#ff4d6d');bleep(150,.5,'sawtooth',.1,-100);return}
sn.unshift(h);let ate=0;
if(h[0]==food[0]&&h[1]==food[1]){sc+=10;spd+=.35;food=rf();ate=1;burst(h[0],h[1],18,THEMES[U.th|0].c[2]);bleep(660+sn.length*8,.1,'triangle',.08);if(!gold&&Math.random()<.3)gold={p:rf(),t:7}}
else if(gold&&h[0]==gold.p[0]&&h[1]==gold.p[1]){sc+=50;ate=1;burst(h[0],h[1],40,'#ffd34d');bleep(1000,.3,'triangle',.1,500);gold=null}
if(!ate)sn.pop()}
function turn(d){if(d[0]==-dir[0]&&d[1]==-dir[1])return;nd=d}
addEventListener('keydown',e=>{const k=e.code;if(/Arrow|Space/.test(k))e.preventDefault();
if(k=='ArrowUp'||k=='KeyW')turn([0,-1]);else if(k=='ArrowDown'||k=='KeyS')turn([0,1]);else if(k=='ArrowLeft'||k=='KeyA')turn([-1,0]);else if(k=='ArrowRight'||k=='KeyD')turn([1,0]);
else if(k=='Space'||k=='Enter'){if(st==0||st==2)reset();else if(st==1)st=3;else if(st==3)st=1}else if(k=='KeyP'){if(st==1)st=3;else if(st==3)st=1}});
let tx=0,ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;if(st!=1)reset()});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>20)turn([Math.sign(dx),0]);else if(Math.abs(dy)>20)turn([0,Math.sign(dy)])});
function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;const now=ts/1000,[c1,c2,c3]=THEMES[U.th|0].c;
if(st==1){acc+=dt*spd;while(acc>=1&&st==1){acc-=1;step()}if(gold){gold.t-=dt;if(gold.t<=0)gold=null}}
for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}pt=pt.filter(p=>p.l>0);
g.clearRect(0,0,W,H);g.fillStyle='rgba(5,3,15,.62)';g.fillRect(ox-6,oy-6,cs*COLS+12,cs*ROWS+12);g.strokeStyle=al(c1,.75);g.shadowColor=c1;g.shadowBlur=18;g.lineWidth=3;g.strokeRect(ox-6,oy-6,cs*COLS+12,cs*ROWS+12);g.shadowBlur=0;
g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=1;g.beginPath();for(let x=0;x<=COLS;x++){g.moveTo(ox+x*cs,oy);g.lineTo(ox+x*cs,oy+ROWS*cs)}for(let y=0;y<=ROWS;y++){g.moveTo(ox,oy+y*cs);g.lineTo(ox+COLS*cs,oy+y*cs)}g.stroke();
const pul=1+.15*Math.sin(now*6);g.shadowColor=c3;g.shadowBlur=16;g.fillStyle=c3;g.beginPath();g.arc(ox+(food[0]+.5)*cs,oy+(food[1]+.5)*cs,cs*.32*pul,0,6.283);g.fill();
if(gold){g.shadowColor='#ffd34d';g.shadowBlur=22;g.fillStyle='#ffd34d';g.beginPath();g.arc(ox+(gold.p[0]+.5)*cs,oy+(gold.p[1]+.5)*cs,cs*.4*pul,0,6.283);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(ox+(gold.p[0]+.5)*cs,oy+(gold.p[1]+.5)*cs,cs*.55,-1.57,-1.57+6.283*gold.t/7);g.stroke()}
sn.forEach((s,i)=>{const k=i/sn.length;g.shadowColor=c1;g.shadowBlur=i?8:16;g.fillStyle=i?al(k<.5?c1:c2,1-k*.55):'#fff';const r=i?cs*.42:cs*.5;g.beginPath();g.roundRect(ox+s[0]*cs+cs*.5-r,oy+s[1]*cs+cs*.5-r,r*2,r*2,r*.45);g.fill()});g.shadowBlur=0;
for(const p of pt){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;
g.textAlign='left';g.font='700 22px "Segoe UI",sans-serif';g.fillStyle='#fff';g.fillText('Очки: '+sc,ox,oy-22);g.textAlign='right';g.fillText('Рекорд: '+best,ox+cs*COLS,oy-22);
if(st!=1){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(ox,oy,cs*COLS,cs*ROWS);g.textAlign='center';g.fillStyle=c3;g.shadowColor=c3;g.shadowBlur=20;g.font='800 44px "Segoe UI",sans-serif';
g.fillText(st==0?'НЕОН-ЗМЕЙКА':st==2?'КОНЕЦ ИГРЫ':'ПАУЗА',W/2,H/2-10);g.shadowBlur=0;g.font='18px "Segoe UI",sans-serif';g.fillStyle='#fff';g.fillText(st==3?'Пробел — продолжить':'Пробел или Enter — '+(st==0?'старт':'ещё раз')+' · стрелки / WASD — управление',W/2,H/2+32)}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
