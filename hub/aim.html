<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аим-тренер</title>
<style>.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:70px 12px 20px}.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.box{padding:6px 16px;border-radius:12px;background:rgba(10,6,28,.7);border:1px solid var(--c1);text-align:center;min-width:90px}.box b{color:var(--c3);font-size:20px}
#fld{position:relative;width:min(94vw,900px);height:min(60vh,480px);border-radius:18px;background:rgba(5,3,15,.6);border:2px solid var(--c1);box-shadow:0 0 26px var(--c1);overflow:hidden;cursor:crosshair}
.tg{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--c2) 19% 45%,#fff 46% 58%,var(--c2) 59%);box-shadow:0 0 18px var(--c2);animation:sh 1.3s linear forwards;cursor:pointer}@keyframes sh{to{transform:scale(.25);opacity:.4}}</style></head><body>
<div class="wrap"><div class="hud"><div class="box">Попадания<br><b id="ht">0</b></div><div class="box">Промахи<br><b id="ms">0</b></div><div class="box">Время<br><b id="tm">30</b></div><div class="box">Рекорд<br><b id="bs">0</b></div></div>
<div id="fld"></div><div class="big" id="res">Нажми «Старт» и бей по мишеням!</div><button onclick="start()" style="font-weight:800;background:var(--c2);color:#000;padding:12px 40px">СТАРТ · 30 секунд</button></div>
<script src="common.js"></script><script>
gbg(1);const $=i=>document.getElementById(i);
let hits=0,miss=0,tm=30,iv=0,rt=[],on=0,best=+localStorage.getItem('aim1')||0;
function upd(){$('ht').textContent=hits;$('ms').textContent=miss;$('tm').textContent=tm;$('bs').textContent=best}
function start(){clearInterval(iv);hits=0;miss=0;tm=30;rt=[];on=1;$('res').textContent='';$('fld').innerHTML='';spawn();iv=setInterval(()=>{tm--;upd();if(tm<=0)end()},1000);upd()}
function spawn(){if(!on)return;const f=$('fld'),w=f.clientWidth||800,h=f.clientHeight||440,r=rnd(22,40),x=rnd(4,Math.max(5,w-r*2-4)),y=rnd(4,Math.max(5,h-r*2-4)),d=document.createElement('div');
d.className='tg';d.style.cssText=`left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px`;const t0=performance.now();
d.onclick=e=>{e.stopPropagation();if(!on)return;rt.push(performance.now()-t0);hits++;bleep(700+hits*5,.05,'triangle',.07);d.remove();upd();spawn()};
f.appendChild(d);setTimeout(()=>{if(on&&d.parentNode){d.remove();miss++;upd();spawn()}},1300)}
$('fld').onclick=()=>{if(on){miss++;upd();bleep(150,.05,'square',.04)}};
function end(){on=0;clearInterval(iv);$('fld').innerHTML='';const acc=hits+miss?Math.round(hits/(hits+miss)*100):0,avg=rt.length?Math.round(rt.reduce((a,b)=>a+b,0)/rt.length):0;if(hits>best){best=hits;try{localStorage.setItem('aim1',best)}catch(e){}}$('res').textContent=`Итог: ${hits} попаданий · точность ${acc}% · средняя реакция ${avg} мс`;upd();bleep(660,.3,'triangle',.1)}
upd();
</script></body></html>
